# crossplane.io/poll-interval: 5s makes the provider notice a change made
# behind its back well before the default 1m poll, and put the thing back.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: poll-interval
spec:
  namespace: parity-poll-interval
  bindings:
  - name: thing
    value: /api/v1/namespaces/parity-external/services/http:fake-external:8080/proxy/things/parity-poll-interval
  steps:
  - name: create reaches Ready
    try:
    - apply:
        file: ../common/providerconfig.yaml
    - apply:
        resource:
          apiVersion: sample.example.com/v1alpha1
          kind: MyType
          metadata:
            name: parity-poll-interval
            annotations:
              crossplane.io/poll-interval: 5s
          spec:
            forProvider:
              configurableField: v1
            providerConfigRef:
              name: parity
              kind: ProviderConfig
    - assert:
        resource:
          apiVersion: sample.example.com/v1alpha1
          kind: MyType
          metadata:
            name: parity-poll-interval
          status:
            atProvider:
              configurableField: v1
            ((conditions[?type == 'Ready'])[0]):
              status: "True"
            ((conditions[?type == 'Synced'])[0]):
              status: "True"
  - name: drift is corrected within the poll interval
    try:
    - script:
        timeout: 40s
        env:
        - name: THING
          value: ($thing)
        content: |
          echo '{"configurableField":"drifted"}' | kubectl replace --raw "$THING" -f - >/dev/null
          for i in $(seq 30); do
            kubectl get --raw "$THING" | grep -q '"configurableField":"v1"' && exit 0
            sleep 1
          done
          echo "drift not corrected within 30s: $(kubectl get --raw "$THING")"
          exit 1
  - name: delete
    try:
    - delete:
        ref:
          apiVersion: sample.example.com/v1alpha1
          kind: MyType
          name: parity-poll-interval
