# Create reaches Ready and creates the thing, a spec change updates it, and
# deleting the MR deletes it.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lifecycle
spec:
  namespace: parity-lifecycle
  bindings:
  - name: thing
    value: /api/v1/namespaces/parity-external/services/http:fake-external:8080/proxy/things/parity-lifecycle
  steps:
  - name: provider config
    try:
    - apply:
        file: ../common/providerconfig.yaml
  - name: create reaches Ready
    try:
    - apply:
        resource:
          apiVersion: sample.example.com/v1alpha1
          kind: MyType
          metadata:
            name: parity-lifecycle
          spec:
            forProvider:
              configurableField: v1
            providerConfigRef:
              name: parity
              kind: ProviderConfig
    - assert:
        resource:
          apiVersion: sample.example.com/v1alpha1
          kind: MyType
          metadata:
            name: parity-lifecycle
            annotations:
              crossplane.io/external-name: parity-lifecycle
          status:
            atProvider:
              configurableField: v1
            ((conditions[?type == 'Ready'])[0]):
              status: "True"
              reason: Available
            ((conditions[?type == 'Synced'])[0]):
              status: "True"
              reason: ReconcileSuccess
    - script:
        env:
        - name: THING
          value: ($thing)
        content: kubectl get --raw "$THING"
        check:
          ($error): ~
          (json_parse($stdout)):
            configurableField: v1
  - name: spec update reaches the thing
    try:
    - patch:
        resource:
          apiVersion: sample.example.com/v1alpha1
          kind: MyType
          metadata:
            name: parity-lifecycle
          spec:
            forProvider:
              configurableField: v2
    - assert:
        resource:
          apiVersion: sample.example.com/v1alpha1
          kind: MyType
          metadata:
            name: parity-lifecycle
          status:
            atProvider:
              configurableField: v2
            ((conditions[?type == 'Synced'])[0]):
              status: "True"
    - script:
        env:
        - name: THING
          value: ($thing)
        content: kubectl get --raw "$THING"
        check:
          ($error): ~
          (json_parse($stdout)):
            configurableField: v2
  - name: delete removes the thing
    try:
    - delete:
        ref:
          apiVersion: sample.example.com/v1alpha1
          kind: MyType
          name: parity-lifecycle
    - script:
        env:
        - name: THING
          value: ($thing)
        content: |
          if out=$(kubectl get --raw "$THING" 2>&1); then echo "thing still exists: $out"; exit 1; fi
          echo "$out" | grep -q NotFound
